    <!--
      结构化数据（JSON-LD）。
      ⛔ 放在 <head> 里、且**在落地块标记注释切片之外**：
        gate-home-landing 判据 4 要求落地块切片内 `<script` 计数为 0（爬虫无需执行 JS 即可读全部正文）。
        JSON-LD 是 `type="application/ld+json"`（不可执行），但判据数的是字面量 `<script`，
        所以**位置**必须落在落地块之外 —— 那是判据真正要的性质。
      ⛔ 绝不加 aggregateRating / review / rating：本项目禁止编造用户评价与星级。
      ⛔ **刻意不加 `potentialAction: SearchAction`**：实测全站**不存在任何检索功能**
        （`grep` src/ 无 URLSearchParams / location.search 消费方，无搜索 UI；
        `src/core/content/query/` 是内部查询层，不对外暴露 URL 参数入口）。
        SearchAction 的语义是「本站在 ?q= 上提供站内检索」，指向一个不存在的端点
        与aggregateRating 同属**对搜索引擎的虚假声明** —— 同一个纪律：少一个 rich result
        好过一个假的。等真做了检索入口再补这一条。
    -->
    <script type="application/ld+json">
