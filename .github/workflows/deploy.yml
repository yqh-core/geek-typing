name: Build & Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # P0.7 收口第 9 项：质量门禁（原为人工本地跑，现进入 CI）
  #
  # 为什么门禁 job 必须写在**本文件内**：
  #   GitHub Actions 的 `needs` 只能引用**同一个 workflow 文件**里的 job。
  #   把门禁放在独立 workflow 再用 `needs: <外部job名>` 引用是**无效的** ——
  #   GitHub 会在解析阶段直接报 `job 'X' needs unknown job 'Y'` 并使整个
  #   workflow 失效，反而比没有门禁更糟（部署会彻底停摆）。
  #   因此这里采用「同文件三闸 + deploy 依赖三闸」的写法，依赖才真正生效。
  #
  # 分三条闸是为了 fast-fail：content/lint 约 30s 就能红，不必等 build。
  # ══════════════════════════════════════════════════════════════════════════

  # ── 闸门 1：不依赖构建产物，最快报红 ────────────────────────────────────────
  gate-static:
    name: 门禁① 静态与内容（无产物）
    runs-on: ubuntu-24.04
    # 兜底超时：本地实测 14s。给 10 分钟余量防止异常挂死烧满 runner。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: 安装依赖
        run: npm ci
      # 判据清单（21 项：manifest 三元组自洽、跨包 ContentId 唯一、inline 预算、
      # manifest↔registry 策略一致性、资产契约……）= scripts/content/validate.mjs 头部，
      # **单一事实源，此处不重述**（重述过的数字会漂，见 P18-D CI 索引）。
      # 实测不依赖 dist。
      - name: 内容门禁（content:validate）
        run: npm run content:validate
      # Provider 覆盖硬门（本刀补的静默失败缺口）：PROVIDER 登记表唯一实现在
      # scripts/content/provider-rules.mjs（build.mjs 不再持表，只 import）。
      # 三条判据：A 漏登记/落盘缺失（provider 不得为 unknown 等）、B 孤儿登记（表里的 key 磁盘上必须存在）、
      # C 外部来源须能在 PROVIDER_REPOSITORY 查到仓库地址（哨兵自有内容豁免）。
      # 防的是「新内容包落盘但忘了登记 ⇒ build 的 ?? 'unknown' 兜底静默写成 unknown，全仓无门拦」。
      # 与已登记不变量的关系：邻近 INV-5（来源/版权硬门）但**不是同一条** —— INV-5 管 license.spdx，
      # 本门管「provider 字段有没有被登记 / 登记得对不对」。**尚未登记为 INV-N**（登记表只有 INV-1..INV-6，
      # 不擅自扩表）；要立为正式不变量需单独裁定。
      # 必须排在 content:validate **之后**：content:validate 读 src/core/content/registry.ts，
      # 而 registry.ts 由 content:generate-registry 生成，新包刚落盘时 validate 会先判「policy=lazy
      # 但 registry.ts 找不到 localId」共 3 项 —— 新包接入的顺序是 generate-registry → validate。
      # 自带 --falsify（S1/S2/S3 三条注入 + 判绿对照组）：本地跑 `npm run verify:provider:falsify`
      # 可复核这道门确实会判红，CI 只跑常规模式（故障注入属证据任务，不进 CI）。
      - name: Provider 覆盖门禁（gate:provider · 溯源登记）
        run: npm run verify:provider
      # 配套单测（做故障注入 + 证明 F-8 真解析得动脚本入口）。
      # ⚠️ **这道 step 不能省**：verify:provider 只 import provider-rules.mjs，
      # 从不加载 build.mjs —— 本刀就出现过「门与单测全绿、而 `npm run content:build`
      # 因重复 import 直接 SyntaxError 起不来」。只有本 step 会真去解析那些入口文件。
      # 本机 EBUSY 时 F-8/F-9 会判 UNKNOWN（既不算过也不算红），由本 CI 兜底执行。
      - name: Provider 规则测试（test:provider-rules · 含脚本入口真解析）
        run: npm run test:provider-rules
      # P18-C′ 注册表生成一致性门：registry.ts 由 scripts/content/generate-registry.mjs 生成，
      # 本门比对「content/ 实际包 ↔ 生成结果 ↔ 磁盘 registry.ts」三者的 localId / policy /
      # ?runtime / 双顺序，有漂移即 EXIT=1。只读 content/ 与 registry.ts，不触碰 dist。
      # 配套测试 `npm run test:generate-registry` 做故障注入（证明这道门确实会判红）。
      - name: 注册表生成一致性门（generate-registry --check · P18-C′）
        run: npm run verify:registry
      - name: 注册表生成器测试（test:generate-registry · P18-C′）
        run: npm run test:generate-registry
      # 单元内容脚手架测试（test:scaffold-unit）：「加第 N+1 个单元」这条命令的判据自证。
      # 全部用例跑在 mkdtemp 临时根；D 组用真实 content/ 但走只读 --check。
      # 覆盖 12 条坏源拦截 + 10 条漂移注入（含 build 戳与载荷排版两个**必须判绿**的对照组）。
      - name: 单元脚手架测试（test:scaffold-unit）
        run: npm run test:scaffold-unit
      # 许可硬门（INV-5 / Plan §4.2）：内容入库**前置**硬门 —— 复用 asset-rules.mjs 与 license-policy.mjs，
      # 不复制任何规则；未过门的内容不得落盘到 content/**。自带 --falsify（N 条用例 + 判绿对照组），
      # 本地跑 `npm run gate:license:falsify` 可复核这道门确实会判红。
      - name: License Gate（asset-rules + license-policy · INV-5）
        run: npm run gate:license
      # 契约断言清单 = tests/content-query.mjs，**单一事实源，此处不重述计数**。
      # 实测只读 content/ 与 src/，不触碰 dist。
      - name: 内容契约测试（test:content）
        run: npm run test:content
      # INV-6 · 类型契约唯一（gate:content-type-contract）：A3.1-③ 接入。
      # 为什么进 gate-static 而不是 gate-build —— 本门只需要 dev server + 只读 content/ 与 src/，
      # **不读 dist/**、不依赖任何构建产物；gate-static 的设计意图是「不依赖构建产物、最快报红」，
      # 放这里不破坏该意图（gate-perf 需要 dist/，那是另一回事，已裁定暂缓接入）。
      # 为什么排在 test:content **之后**：两者同域（都读 content/）；且本门经
      # src/core/content/registry.ts 的 `import … '?runtime'` 加载内容包，须在 registry 相关
      # 生成器（verify:registry / test:generate-registry）之后跑。
      # 不会重演「本机绿 / CI 红」的依据：① 自带 13 条 falsify 注入自证，本机实跑 13/13
      # 恰好判红且还原后复绿（门能判红这件事本身是机器判据）；② **无环境相关断言** ——
      # 路径全部 `join(ROOT, rel)` 相对化，脚本内搜遍 `C:\` / `/c/` / `win32` 字面量 0 命中；
      # ③ 无浏览器 / 无 sleep / 无固定端口，G 判据刻意用进程内 `ts.createProgram` 而非 spawn
      # 子进程，故不受本机 node→node spawn 间歇性 EBUSY 影响（F-8 类 UNKNOWN 不会发生在本门）。
      # 判据清单 = scripts/gate-content-type-contract.mjs 头部，**单一事实源，此处不重述**。
      - name: 类型契约门（gate:content-type-contract · INV-6）
        run: npm run gate:content-type-contract
      # P18-D · INV-2：UI 内容契约棘轮门（纯静态 AST 扫描 —— 只读 src/ 与 content/ 的目录名，
      # 不需要 dist，故属本条闸）。硬零 2 桶（直读词表 JSON / 内容包 id 分支）+ 棘轮 4 桶
      # （只许降不许升，基线 docs/p18/_generated/ui-contract-baseline.json）+ 对照组探针双向钳制。
      # 注意：`test:ui-contract:falsify` **不进 CI** —— 它做的是故障注入演练（证明门能判红），
      # 属证据任务而非每次构建的门，已登记在 P18 证据任务表（FALSIFY-UI-CONTRACT）。
      - name: UI 内容契约棘轮门（test:ui-contract · INV-2）
        run: npm run test:ui-contract
      # oxlint 棘轮门：脚本 = scripts/gate-lint.mjs（外面包一层基线比对，不改 `npm run lint` 本身）。
      # 基线（docs/p18/_generated/_baselines/lint-warnings.json）现在是 **total 0 warning**，
      # 只许降不许升：当前 total 或任一规则的当前值超过基线 ⇒ FAIL(1)；
      # 基线文件缺失 ⇒ UNKNOWN(2)，按本项目三态约定**视为不通过**，不静默放行。
      # 想降数只能真改代码（本门不会为了变绿去关规则）。
      # 本地可用 `npm run gate:lint:falsify` 复核这道门本身确实会判红。
      - name: Lint（oxlint）
        run: npm run gate:lint

  # ── 闸门 2：需要 dist/ 与 preview 服务器 ───────────────────────────────────
  gate-build:
    name: 门禁② 构建产物（体积 + 离线）
    runs-on: ubuntu-24.04
    # 兜底超时：本地实测 build+bundle+chromium+offline 约 1 分钟，CI 实测 51s（含失败）。
    # 给 20 分钟余量防止挂死。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: 安装依赖
        run: npm ci
      # 夹带 tsc -b 类型检查（build = tsc -b && vite build）
      - name: 类型检查 & 构建
        run: npm run build
      # 判据清单与阈值 = scripts/check-bundle.mjs 头部 + scripts/gate-perf.mjs 预算表
      # （**单一事实源，此处不重述计数与数字** —— 判据 4/5 是 P18-C 新增的，
      #   重述的步名曾经停在「3 项 / raw ≤420KiB」，见 P18-D CI 索引）。
      # 三态判定，UNKNOWN 视为不通过。
      - name: 体积门禁（check:bundle）
        run: npm run check:bundle
      - name: 安装 Chromium
        run: npx playwright@1.49.1 install chromium --with-deps
      # 场景 态1/1.5/2/3/4/4b（判据清单 = tests/offline-audit.mjs，此处不重述计数）。
      # offline-audit.mjs 经 preview-server.mjs 自举
      # vite preview（127.0.0.1:4173），自带生命周期，无需额外起服务。
      # 只打本机地址 —— 打生产的是 test:prod，见文件末尾说明。
      - name: 离线审计（test:offline）
        run: npm run test:offline

  # ── 闸门 3：真实浏览器端到端（原仅 PR 触发，现补齐 push main）─────────────
  gate-e2e:
    name: 门禁③ 端到端（test:e2e）
    runs-on: ubuntu-24.04
    # 兜底超时（关键）：CI run 36308273299 曾因 16 处 networkidle 在最终环境上
    # 挂死 25 分钟且不会自动失败，只能人工 cancel——白白烧 runner 额度且看起来
    # 像「一直在跑」。已在 tests/e2e.mjs 改用 waitUntil:'load' + 显式超时修根因，
    # 这里是第二层保险：到点强制失败。本地实测 e2e 约 2.5 分钟。
    # 预算从 20 调到 30：新增 verify:learning-unit 这条真机脚本（自带 preview 自举
    # + 完整 CDP 走查 V1/V2/V3/V5），本地实测约 1 分钟，CI 上加装 Chromium 依赖与
    # 冷启动更慢，20 分钟在慢 runner 上余量太薄 —— 与其留一个会随机超时的预算，
    # 不如给足余量让超时真的只承担「挂死兜底」这一个职责。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: 安装依赖
        run: npm ci
      - name: 类型检查 & 构建
        run: npm run build
      - name: 安装 Chromium
        run: npx playwright@1.49.1 install chromium --with-deps
      # e2e.mjs 同样自举 preview，无需手动起服务（旧 e2e.yml 的
      # 「npm run preview & + curl 探活」是冗余的）。
      - name: 端到端测试
        run: npm run test:e2e
      # 学习单元真机验收（Stage 2 V1/V2/V3/V5）。必须排在「安装 Chromium」**之后**：
      # 本脚本零 Playwright 依赖、自己找浏览器（tests/helpers/chrome.mjs，认
      # PLAYWRIGHT_BROWSERS_PATH 下的 chromium），没装 Chromium 时它只会报「找不到浏览器」。
      # `-- --serve` 是显式 opt-in：默认（不带）preview 必须由外部起好，否则脚本直接失败、
      # 绝不自己偷起一个测错实例；CI 上没有外部 preview，所以这里显式要求它自起
      # （端口 4175，与 e2e 的 4173 / offline 的 4174 隔离），跑完自动 stop。
      - name: 学习单元真机验收（verify:learning-unit · V1/V2/V3/V5）
        run: npm run verify:learning-unit -- --serve
      # ⚠️ verify:learning-unit:falsify **不进 CI** —— 它做的是故障注入演练（证明门会判红），
      #    属证据任务；常规模式进门已足够，自证能力本地跑 `npm run verify:learning-unit:falsify` 复核。

  # ── 部署：needs 三条闸，任一失败/取消/跳过都不部署 ─────────────────────────
  deploy:
    name: 部署到 Cloudflare Pages
    needs: [gate-static, gate-build, gate-e2e]
    timeout-minutes: 20
    # if 里显式判三条闸的 result，而非只写 always()：
    #   - 不写 always() 时，某闸失败会让本 job 被隐式跳过，表现为 skipped，
    #     容易掩盖「闸门未决」；
    #   - 只写 always() 则会在闸门 failure 时照样进入。
    # 因此用 always() && 三条 result == 'success'：既保证「未决」不被误判为通过，
    # 也保证任一失败都不部署。
    if: >-
      always() &&
      needs.gate-static.result == 'success' &&
      needs.gate-build.result == 'success' &&
      needs.gate-e2e.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check & build
        run: npm run build

      # 部署前先自检 Secret 是否注入到位，避免 wrangler 报出含义模糊的授权错误
      - name: Verify Cloudflare secrets injected
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          missing=0
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN 为空 —— 请在仓库 Settings → Secrets and variables → Actions 里重新添加"
            missing=1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID 为空 —— 请在仓库 Settings → Secrets and variables → Actions 里重新添加"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "两个 Secret 均已注入"

      # 只有推送到 main 才部署；PR 仅做构建校验
      - name: Publish to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 不带 --branch，确保发布到生产环境（https://geek-typing.pages.dev）
          command: pages deploy dist --project-name=geek-typing --commit-dirty=true

# ──────────────────────────────────────────────────────────────────────────────
# 明确排除：这些脚本绝不能进 CI
#
#   npm run test:smoke     → tests/prod-smoke.mjs，固定打 https://geek-typing.pages.dev
#   npm run test:prod      → tests/offline-audit.mjs --prod，打生产域名
#   npm run test:e2e:prod  → tests/e2e.mjs --prod，打生产域名
#
#   CI 在部署**之前**跑，打的是「上一个版本」的生产环境：拿旧产物做断言必然误报，
#   且把生产流量混进 PR 校验后失败原因无法归因到本次改动。
#   这类生产专属指纹（308 canonical、_headers 生效、边缘压缩、真实 SW 升级链路）
#   只能在部署**之后**作为独立的 post-deploy 校验运行。
# ──────────────────────────────────────────────────────────────────────────────
